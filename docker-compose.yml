services:
  mindcraft:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Coolify injects these values. Do not commit API keys.
      MINECRAFT_HOST: ${MINECRAFT_HOST:?Set MINECRAFT_HOST in Coolify}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-55916}
      MINDSERVER_PORT: 8080
      PROFILES: '["./andy.json"]'
      SETTINGS_JSON: '{"auto_open_ui":false,"render_bot_view":false}'
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8080"
      - "3000-3003"
