services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    command: >-
      sh -c "ollama serve &
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull sweaterdog/andy-4:micro-q8_0;
      ollama pull embeddinggemma;
      wait"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  mindcraft:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      MINECRAFT_HOST: ${MINECRAFT_HOST:?Set MINECRAFT_HOST in Coolify}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-55916}
      MINDSERVER_PORT: 8080
      PROFILES: '["./profiles/andy-4.json"]'
      SETTINGS_JSON: '{"auto_open_ui":false,"render_bot_view":false}'
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8080"

volumes:
  ollama-data:
