services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "ollama serve &
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull sweaterdog/andy-4:latest;
      ollama pull embeddinggemma;
      wait"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  mindcraft:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MINECRAFT_HOST: ${MINECRAFT_HOST:?Set MINECRAFT_HOST in Coolify}
      MINECRAFT_PORT: ${MINECRAFT_PORT:-25565}
      MINDSERVER_PORT: 8080
      PROFILES: '["./profiles/aria.json"]'
      OPENAI_API_KEY: ${OMNI_ROUTER_API_KEY:?Set OMNI_ROUTER_API_KEY in Coolify}
      SETTINGS_JSON: '{"minecraft_version":"1.21.11","auto_open_ui":false,"render_bot_view":true}'
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8080"
      - "3000-3003"

volumes:
  ollama-data:
